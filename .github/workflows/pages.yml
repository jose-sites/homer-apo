name: Publish Pages visual preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
      - uses: actions/upload-artifact@v4
        with:
          name: verified-pages-preview
          path: dist
      - name: Check Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api repos/${{ github.repository }}/pages --jq .build_type)
          if [ "$source" != "workflow" ]; then
            echo "::error::The repository owner must select Settings > Pages > Source > GitHub Actions, then rerun this workflow. The current integration cannot change this setting (HTTP 403)."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deploy
